<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FusionFirst Creative — Typography</title>
  <style>
:root {

  --bg: #0A0A0B;
  --surface: #18181D;
  --surface-warm: var(--surface);
  --fg: #F5F5F0;
  --fg-2: #A8A8A8;
  --muted: #6B6B72;
  --meta: var(--muted);
  --border: #2A2A33;
  --border-soft: var(--border);
  --accent: #FF5722;
  --accent-on: #0A0A0B;
  --accent-hover: color-mix(in oklab, var(--accent), black 8%);
  --accent-active: color-mix(in oklab, var(--accent), black 14%);
  --success: #5EBA82;
  --warn: #f59e0b;
  --danger: #FF3366;
  --font-display: 'Inter Tight', 'Inter', -apple-system, system-ui, sans-serif;
  --font-body: 'Inter', -apple-system, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 24px;
  --text-2xl: 32px;
  --text-3xl: 48px;
  --text-4xl: 72px;
  --leading-body: 1.6;
  --leading-tight: 1.1;
  --tracking-display: -0.02em;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;
  --space-6: 48px;
  --space-8: 96px;
  --space-12: 128px;
  --space-20: 192px;
  --section-y-desktop: 96px;
  --section-y-tablet: 64px;
  --section-y-phone: 32px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 4px 12px rgba(10, 10, 11, 0.4);
  --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 70%);
  --motion-fast: 150ms;
  --motion-base: 300ms;
  --ease-standard: cubic-bezier(0.16, 1, 0.3, 1);
  --container-max: 1200px;
  --container-gutter-desktop: 36px;
  --container-gutter-tablet: 24px;
  --container-gutter-phone: 16px;
  --heat: #FF5722;
  --fusion: #FFB627;
  --plasma: #00E5FF;
  --ember: #FF3366;
  --text-on-heat: #0A0A0B;
}

    body { font-family: var(--font-body); background: var(--bg); color: var(--fg); margin: 0; padding: var(--space-4); }
  </style>
</head>
<body>
  <h1 style="font-family: var(--font-display); font-size: var(--text-4xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-display); margin-bottom: var(--space-4);">Display — 76px</h1>
  <h2 style="font-family: var(--font-display); font-size: var(--text-3xl); line-height: var(--leading-tight); margin-bottom: var(--space-3);">Headline — 54px</h2>
  <h3 style="font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-tight); margin-bottom: var(--space-3);">Section Title — 36px</h3>
  <h4 style="font-family: var(--font-display); font-size: var(--text-xl); line-height: var(--leading-tight); margin-bottom: var(--space-2);">H2 — 24px</h4>
  <p style="font-size: var(--text-base); line-height: var(--leading-body); margin-bottom: var(--space-4);">Body — 16px. The quick brown fox jumps over the lazy dog.</p>
  <p style="font-size: var(--text-sm); line-height: var(--leading-body); margin-bottom: var(--space-2);">Caption — 14px. The quick brown fox jumps over the lazy dog.</p>
  <p style="font-family: var(--font-mono); font-size: var(--text-base); margin-bottom: var(--space-4);">Code — 16px monospace. console.log("hello world");</p>
</body>
</html>
